# Dashboard theme: ocean blue, heatwave orange, warm paper background.
# Streamlit reads this file from the directory it is started in (the repo root).

[theme]
base = "light"
primaryColor = "#eb6834"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
linkColor = "#1c5cab"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "10px"
# Streamlit's bundled sans-serif: works offline, so charts measure text right
font = "sans-serif"
headingFontWeights = [700, 600, 600]
metricValueFontWeight = 600
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#898781"]

[theme.sidebar]
backgroundColor = "#f1f0ec"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
