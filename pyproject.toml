[project]
name = "cabrera-twin"
version = "0.1.0"
description = "Marine heatwave indicators for the Cabrera National Park MPA (Balearic Islands) - a Digital Twin Ocean building block"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Pierre St-Cricq dit Lompre" }]
dependencies = [
    "bottleneck>=1.6.0",
    "copernicusmarine>=2.4",
    "netcdf4>=1.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pystac>=1.15.2",
    "requests>=2.32",
    "scipy>=1.18.1",
    "shapely>=2.0",
    "xarray>=2024.10",
    "zarr>=3.4.0",
]

[project.scripts]
cabrera-twin = "cabrera_twin.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pystac[validation]>=1.15.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raised inside xarray's netCDF4 writer (xarray 2026.7), not by this code
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:xarray.backends.netCDF4_",
]

[tool.ruff]
line-length = 88
target-version = "py312"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
