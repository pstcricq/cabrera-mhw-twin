site_name: cabrera-mhw-twin
site_description: >-
  Marine heatwave indicators for the Cabrera Archipelago National Park, a small
  Digital Twin Ocean component: technical documentation.
site_url: https://pstcricq.github.io/cabrera-mhw-twin/
repo_url: https://github.com/pstcricq/cabrera-mhw-twin
repo_name: pstcricq/cabrera-mhw-twin
edit_uri: edit/main/docs/
copyright: Code under the MIT licence. Data under the terms of their providers.

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Architecture: architecture.md
      - Data: data.md
      - Method: method.md
  - Services:
      - API: api.md
      - Dashboard: dashboard.md
  - Development: development.md
  - Code reference:
      - Overview: reference/index.md
      - Ingestion: reference/ingest.md
      - Analysis: reference/analysis.md
      - Export: reference/export.md
      - API and pipeline: reference/service.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/waves
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
